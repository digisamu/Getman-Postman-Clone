name: Release

# Push a tag like v0.2.0 to build installers for every platform and publish them as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.msi
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Getman ${{ github.ref_name }}
          files: installers/*
          generate_release_notes: true
          body: |
            ## Download

            | System | File |
            | --- | --- |
            | macOS (Apple Silicon) | `Getman-*-mac-arm64.dmg` |
            | macOS (Intel) | `Getman-*-mac-x64.dmg` |
            | Windows | `Getman-*-windows-setup.exe` (or the `.msi`) |
            | Linux | `.AppImage` (any distro) or `.deb` (Debian/Ubuntu) |

            The builds are not signed with a paid developer certificate, so the first launch needs one extra step:

            - **macOS**: open the app, then go to System Settings → Privacy & Security and click **Open Anyway**.
            - **Windows**: on the SmartScreen prompt click **More info** → **Run anyway**.
            - **Linux (AppImage)**: `chmod +x Getman-*.AppImage` and run it.
